interface:
  display_name: "Dealership Showroom Car Compositor"
  short_description: "Adapt vehicle photos to the dealership showroom mood."
  default_prompt: "Use $dealership-showroom-compositor to process every vehicle photo under autos/ into a 1536×1024 showroom image. Keep each source car's viewpoint, framing, apparent size, details, and original plate; use background.png as a visual guide and add the dealership logo only where it fits naturally. Write the results under output/."

policy:
  allow_implicit_invocation: true
