interface:
  display_name: "Dealership Showroom Car Compositor"
  short_description: "Create showroom images while preserving visible car details and adding a fixed logo overlay."
  default_prompt: "Use $dealership-showroom-compositor to process every supported photo under autos/ using background.jpeg as a loose showroom guide. Preserve each source's visible car content, colors, view, crop, and size; allow only plausible lighting and reflection changes, and never invent unseen parts. Write 1536×1024 PNGs under output/<vehicle>/ and add the original transparent black logo.svg, about 160 px wide and 32 px from the left and bottom edges, to every output, even if it overlaps the car."

policy:
  allow_implicit_invocation: true
