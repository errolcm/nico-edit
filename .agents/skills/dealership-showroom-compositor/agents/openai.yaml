interface:
  display_name: "Dealership Showroom Car Compositor"
  short_description: "Batch-composite cars into the fixed dealership showroom."
  default_prompt: "Use $dealership-showroom-compositor to process every image under autos/vehicle-folder/ into a native-size showroom image using background.png as the locked plate; preserve the exact car and interior/detail framing, replace outdoor lighting and reflections with warm showroom cues, and write matching results under output/vehicle-folder/."

policy:
  allow_implicit_invocation: true
